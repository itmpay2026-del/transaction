<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWIKAFRIKA Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 style="font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 2px; color: #2196F3; text-align: center; margin-bottom: 20px; font-size: 2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">TWIKAFRIKA</h1>
    <div class="user-info" style="justify-content: flex-end;">
      <a href="/services" style="margin-left: 15px; background: #2196F3; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 14px;">Dashboard</a>
      <a href="/chat.html" style="margin-left: 10px; background: #E91E63; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 14px;">Live Chat</a>
    </div>
    <div class="balance-card">
      <h2>Current Balance</h2>
      <div id="balance">$0.00</div>
    </div>
    <div class="send-card">
      <h3>Send Money</h3>
      <input type="email" id="receiverEmail" placeholder="Receiver Email">
      <input type="number" id="amount" placeholder="Amount" step="0.01" min="0.01">
      <button id="sendBtn">Send</button>
      <div id="sendMessage"></div>
    </div>
    <div class="history-card">
      <h3>Transaction History</h3>
      <ul id="historyList"></ul>
    </div>
  </div>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/';
    } else {
      fetch('/auth/verify', {
        headers: { 'Authorization': `Bearer ${token}` }
      }).then(res => {
        if (!res.ok) {
          localStorage.clear();
          window.location.href = '/';
        }
      }).catch(() => {
        localStorage.clear();
        window.location.href = '/';
      });
    }

    async function fetchBalance() {
      const res = await fetch('/wallet/balance', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      document.getElementById('balance').textContent = `$${data.balance.toFixed(2)}`;
    }

    async function fetchHistory() {
      const res = await fetch('/wallet/history', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      for (const tx of data.transactions) {
        const li = document.createElement('li');
        const isSender = tx.sender === localStorage.getItem('userEmail');
        const direction = isSender ? `→ to ${tx.receiver}` : `← from ${tx.sender}`;
        const sign = isSender ? '-' : '+';
        li.innerHTML = `${new Date(tx.createdAt).toLocaleString()} ${direction} <strong>${sign}$${tx.amount.toFixed(2)}</strong> <span class="status ${tx.status}">${tx.status}</span>`;
        list.appendChild(li);
      }
    }

    document.getElementById('sendBtn').addEventListener('click', async () => {
      const receiverEmail = document.getElementById('receiverEmail').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const sendMessage = document.getElementById('sendMessage');
      if (!receiverEmail || isNaN(amount) || amount <= 0) {
        sendMessage.textContent = 'Invalid receiver or amount';
        sendMessage.style.color = 'red';
        return;
      }
      try {
        const res = await fetch('/wallet/send', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ receiverEmail, amount })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        sendMessage.textContent = `✅ ${data.message}`;
        sendMessage.style.color = 'green';
        document.getElementById('receiverEmail').value = '';
        document.getElementById('amount').value = '';
        fetchBalance();
        fetchHistory();
      } catch (err) {
        sendMessage.textContent = `❌ ${err.message}`;
        sendMessage.style.color = 'red';
      }
    });

    fetchBalance();
    fetchHistory();
  </script>
</body>
</html>
