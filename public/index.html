<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWIKAFRIKA System - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #808080;">
  <div class="container">
    <h1 style="font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 2px; color: #2196F3; text-align: center; margin-bottom: 20px; font-size: 2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">TWIKAFRIKA</h1>
    <div class="auth-box">
      <div class="tabs">
        <button id="loginTab" class="active">Login</button>
        <button id="registerTab">Register</button>
      </div>
      <form id="authForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="submitBtn">Login</button>
      </form>
      <div id="message"></div>
    </div>
  </div>
  <script>
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const authForm = document.getElementById('authForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');

    let mode = 'login';

    loginTab.addEventListener('click', () => {
      mode = 'login';
      loginTab.classList.add('active');
      registerTab.classList.remove('active');
      submitBtn.textContent = 'Login';
      messageDiv.innerHTML = '';
    });

    registerTab.addEventListener('click', () => {
      mode = 'register';
      registerTab.classList.add('active');
      loginTab.classList.remove('active');
      submitBtn.textContent = 'Register';
      messageDiv.innerHTML = '';
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const endpoint = mode === 'login' ? '/auth/login' : '/auth/register';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        localStorage.setItem('token', data.token);
        localStorage.setItem('userEmail', data.email);
        window.location.href = '/services.html';
      } catch (err) {
        messageDiv.textContent = err.message;
        messageDiv.style.color = 'red';
      }
    });

    // If already logged in, redirect to services page
    const storedToken = localStorage.getItem('token');
    if (storedToken) {
      fetch('/auth/verify', {
        headers: { 'Authorization': `Bearer ${storedToken}` }
      }).then(res => {
        if (res.ok) {
          window.location.href = '/services.html';
        } else {
          localStorage.clear();
        }
      }).catch(() => {
        localStorage.clear();
      });
    }
  </script>
</body>
</html>
