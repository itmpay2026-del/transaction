<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Chat - Transaction System</title>
  <link rel="stylesheet" href="services.css">
  <style>
    body {
      background: #f4f7f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    .chat-container {
      max-width: 800px;
      margin: 40px auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 80vh;
    }
    .chat-header {
      background: #E91E63;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .chat-header h1 {
      margin: 0;
      font-size: 24px;
    }
    .chat-setup {
      padding: 20px;
      background: #fafafa;
      border-bottom: 1px solid #eee;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .chat-setup input {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 300px;
    }
    .chat-setup button {
      padding: 10px 20px;
      background: #E91E63;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .chat-setup button:hover {
      background: #d81b60;
    }
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.4;
    }
    .message.received {
      background: #e9ecef;
      align-self: flex-start;
      border-bottom-left-radius: 0;
    }
    .message.sent {
      background: #E91E63;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 0;
    }
    .message-meta {
      font-size: 0.75rem;
      margin-top: 5px;
      opacity: 0.8;
      text-align: right;
    }
    .chat-input {
      padding: 20px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }
    .chat-input input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
    }
    .chat-input button {
      padding: 12px 24px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    .chat-input button:hover {
      background: #388E3C;
    }
    .chat-input button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .back-link {
      display: inline-block;
      margin-top: 10px;
      color: white;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h1>Live Dispute Chat</h1>
      <a href="/services" class="back-link">&larr; Back to Services</a>
    </div>

    <div class="chat-setup" id="setupSection">
      <input type="text" id="disputeIdInput" placeholder="Enter Dispute ID to join..." />
      <button id="joinBtn">Join Room</button>
    </div>

    <div class="chat-messages" id="messagesArea">
      <!-- Messages will appear here -->
      <div style="text-align: center; color: #888; margin-top: 40px;">
        Please join a dispute room to start chatting.
      </div>
    </div>

    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type your message..." disabled />
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      alert('You must be logged in to use the chat.');
      window.location.href = '/auth';
    }

    const socket = io();
    let currentDisputeId = null;

    const setupSection = document.getElementById('setupSection');
    const disputeIdInput = document.getElementById('disputeIdInput');
    const joinBtn = document.getElementById('joinBtn');
    const messagesArea = document.getElementById('messagesArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // Parse dispute ID from URL if present (e.g. ?disputeId=123)
    const urlParams = new URLSearchParams(window.location.search);
    const paramDisputeId = urlParams.get('disputeId');
    if (paramDisputeId) {
      disputeIdInput.value = paramDisputeId;
    }

    joinBtn.addEventListener('click', () => {
      const dId = disputeIdInput.value.trim();
      if (!dId) return alert('Please enter a Dispute ID');

      currentDisputeId = dId;
      socket.emit('joinDisputeRoom', currentDisputeId);
      
      messagesArea.innerHTML = `<div style="text-align: center; color: #4CAF50; margin-bottom: 20px;">Successfully joined dispute room: ${currentDisputeId}</div>`;
      
      messageInput.disabled = false;
      sendBtn.disabled = false;
      messageInput.focus();
    });

    socket.on('disputeMessage', (msg) => {
      appendMessage(msg.message, 'received', msg.timestamp);
    });

    sendBtn.addEventListener('click', async () => {
      const text = messageInput.value.trim();
      if (!text || !currentDisputeId) return;

      messageInput.value = '';
      
      try {
        const res = await fetch(`/chat/disputes/disputes/${currentDisputeId}/messages`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ message: text })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.error || 'Failed to send message');
        }
        
        appendMessage(text, 'sent', new Date());
      } catch (err) {
        alert(err.message);
      }
    });

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendBtn.click();
      }
    });

    function appendMessage(text, type, timestamp) {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      
      const timeStr = new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      div.innerHTML = `
        <div>${text}</div>
        <div class="message-meta">${timeStr}</div>
      `;
      
      messagesArea.appendChild(div);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }
  </script>
</body>
</html>
